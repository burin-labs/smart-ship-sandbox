name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Build the site with its deploy receipt
        run: |
          mkdir -p _site
          status="$(tr -d '[:space:]' < app/status.txt)"
          printf '{"status":"%s","commit":"%s"}\n' "$status" "$GITHUB_SHA" > _site/health.json
          echo "Smart Ship sandbox" > _site/index.html
      - uses: actions/upload-pages-artifact@v3
      - uses: actions/deploy-pages@v4
