name: Smart Ship

# Mirrors the production callers so this sandbox proves the real wake path.
# The shared runner decides which events wake the shepherd.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] same-repository PRs only; the shared look runs its own pinned script, and only its repair checks out PR code, without credentials
    types: [labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_run: # zizmor: ignore[dangerous-triggers] the shared look reads the PR through the API and acts only on a same-repository PR's own CI run
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to look at; empty runs a sweep.
        type: string
        default: ""
      repair_turns:
        description: Model turns for this look's repair; a small number forces a timeout for the continuation proof.
        type: string
        default: "60"

permissions:
  contents: read

jobs:
  ship:
    uses: burin-labs/.github/.github/workflows/smart-ship.yml@3be52bec8cebbe67ce99853769b3d91d33c70ac3
    with:
      repair: true
      repair-turns: ${{ fromJSON(github.event.inputs.repair_turns || vars.SHIP_REPAIR_TURNS || '60') }}
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
