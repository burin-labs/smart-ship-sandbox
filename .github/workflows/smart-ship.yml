name: Smart Ship hosted credential observation

# This branch-only caller runs the unmodified shared workflow. The caller on
# the sandbox's default branch and its existing event subscriptions stay put.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: The existing sandbox credential-probe pull request
        type: string
        required: true

permissions:
  contents: read

jobs:
  ship:
    if: inputs.pr == '76' && github.repository == 'burin-labs/smart-ship-sandbox'
    uses: burin-labs/.github/.github/workflows/smart-ship.yml@e555dc8b502322cefb25e409aad68821fe2c1b36
    with:
      runs-on: '["self-hosted", "Linux", "X64", "hetzner-3"]'
      repair: true
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
