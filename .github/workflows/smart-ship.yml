name: Smart Ship

# Mirrors the production callers so this sandbox proves the real wake path.
# The shared runner decides which events wake the shepherd.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] never checks out or runs pull request code; the shared runner reads the PR through the API and runs its own pinned scripts
    types: [labeled, unlabeled, synchronize, ready_for_review, dequeued, closed]
  pull_request_review:
    types: [submitted]
  workflow_run: # zizmor: ignore[dangerous-triggers] the pinned shared runner admits only completed same-repository runs, reads metadata through the API, and never checks out the parent-run ref
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  # The review-thread relay in burin-labs/.github dispatches with `pr`.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to look at; empty runs a sweep.
        type: string
        default: ""
      main_red:
        description: Synthetic invalid input for the main-red dispatch canary.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ship:
    if: ${{ inputs.main_red != 'process-canary' }}
    uses: burin-labs/.github/.github/workflows/smart-ship.yml@228f4ce7fa2c35ce1aaf7e3ca16e2cc1e64060f2
    with:
      burin-ref: f08fb24c8b9b31046c3712d442c2fbd4a7087555
      ship-label: ship-parallel-canary
      repair: false
      main-red: ${{ inputs.main_red }}
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  process-lifecycle:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.main_red == 'process-canary' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Mint read access to the candidate
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: burin-labs
          repositories: burin-code
      - name: Check out the exact repair candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: burin-labs/burin-code
          ref: bc0b0539ea07db66aaba4883e3214a6d0ab6e72a
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Fetch the pinned Harn runtime
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ github.token }}
          precompile: "false"
      - name: Verify repair cancellation and owner death on Linux
        run: node --experimental-strip-types --no-warnings --test scripts/tests/test-smart-ship-repair-owner.ts
      - name: Verify real repair deadline and stop
        run: ./scripts/harnw test scripts/tests/test_smart_ship_repair_process_harn.harn
