name: Smart Ship

# Mirrors the production callers so this sandbox proves the real wake path.
# The shared runner decides which events wake the shepherd.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] never checks out or runs pull request code; the shared runner reads the PR through the API and runs its own pinned scripts
    types: [labeled, unlabeled, synchronize, ready_for_review, dequeued, closed]
  pull_request_review:
    types: [submitted]
  workflow_run: # zizmor: ignore[dangerous-triggers] the pinned shared runner admits only completed same-repository runs, reads metadata through the API, and never checks out the parent-run ref
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  # The review-thread relay in burin-labs/.github dispatches with `pr`.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to look at; empty runs a sweep.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ship:
    uses: burin-labs/.github/.github/workflows/smart-ship.yml@2ef969f35ae0384e786be20d9eb2467edc88e8bd
    with:
      # Exercise the production repair path on deliberately broken fixtures.
      repair: true
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
