name: Smart Ship

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, ready_for_review, dequeued, closed]
  pull_request_review:
    types: [submitted]
  pull_request_review_thread:
    types: [resolved, unresolved]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: smart-ship-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ship:
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'ship')
      || (github.event.action == 'unlabeled' && github.event.label.name == 'ship')
    uses: burin-labs/.github/.github/workflows/smart-ship.yml@8121581cdcbde3715dcaad63e386e186f4cf1bc7
    with:
      burin-ref: 8050202f6c67cf17d3a4f942d395c124cb2138bb
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
