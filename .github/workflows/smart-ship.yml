name: Swift failure identity canary

on:
  workflow_dispatch:
    inputs:
      pr:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [attributed, timeout]
    steps:
      - name: Mint the release app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: burin-code
      - name: Check out the identity producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: burin-labs/burin-code
          ref: 3cf96d269e466bf1dd43265b9b14b72a10bd4063
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - name: Fetch Harn
        uses: ./.github/actions/fetch-harn
        with:
          github-token: ${{ github.token }}
          precompile: "false"
      - name: Simulate the completed XCTest result
        id: full
        env:
          MODE: ${{ matrix.mode }}
        run: |
          mkdir -p .build
          printf '%s\n' "<testsuites><testsuite tests='1' failures='1'><testcase classname='BurinAppTests.CanaryTests' name='testExample'><failure message='failure'/></testcase></testsuite></testsuites>" > .build/test-results.xml
          printf '%s\n' "$GITHUB_WORKSPACE/Tests/BurinAppTests/CanaryTests.swift:12: error: -[BurinAppTests.CanaryTests testExample] : assertion failed" > .build/swift-test-output.log
          if [ "$MODE" = timeout ]; then exit 124; fi
          echo "swift_test_failed=true" >> "$GITHUB_OUTPUT"
          exit 1
      - name: Record the Swift test failure identity
        if: ${{ failure() && steps.full.outputs.swift_test_failed == 'true' }}
        run: >-
          ./scripts/harnw run scripts/record-swift-failure-identity.harn --
          .build/test-results.xml .build/swift-test-output.log
