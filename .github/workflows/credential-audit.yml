name: Smart Ship credential audit

# A targeted diagnostic copy of the merged workflow's job. The extra trusted
# audit steps inspect its real run records before the existing cleanup step.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Dedicated sandbox pull request to repair.
        type: string
        required: true

permissions:
  contents: read

jobs:
  ship:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: smart-ship-${{ github.repository }}-pr-${{ inputs.pr }}
      cancel-in-progress: false
    env:
      AUDIT_CANARY: smartship-audit-control-${{ github.run_id }}
    steps:
      - name: Check out the trusted audit harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .credential-audit
          persist-credentials: false
      - name: Verify the audit controls
        run: python3 .credential-audit/scripts/test_smart_ship_credential_audit.py
      - name: Mint the release app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-checks: read
          permission-statuses: read
          permission-contents: write
          permission-pull-requests: write
      - name: Check out Smart Ship at the audited merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: burin-labs/.github
          ref: a51931d6ed24b8fb4f7fd22de00bbab4dae4ee7f
          path: .smart-ship
          sparse-checkout: scripts/smart-ship
          persist-credentials: false
      - name: Install Harn
        uses: burin-labs/harn/.github/actions/setup-harn@389a3aeb579e70d73999d7af6eac7b22a30c7808
        with:
          version: "0.10.180"
      - name: Look at the pull request
        working-directory: .smart-ship/scripts/smart-ship
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          SHIP_REPAIR: "true"
          SHIP_REPAIR_TURNS: "60"
          SHIP_WORK: ${{ runner.temp }}/smartship-audit-control-${{ github.run_id }}
        run: |
          set -euo pipefail
          harn install --locked
          harn run --no-sandbox ship.harn
      - name: Repair without credentials
        timeout-minutes: 25
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHIP_WORK: ${{ runner.temp }}/smartship-audit-control-${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -f "$SHIP_WORK/pr/.git/ship-task.json" ] || exit 0
          # The script runs from its own directory so the sandbox's write jail is only that copy and
          # the checkout, never the Smart Ship scripts the publish step runs next.
          mkdir -p "$SHIP_WORK/agent"
          cp .smart-ship/scripts/smart-ship/repair.harn "$SHIP_WORK/agent/repair.harn"
          cd "$SHIP_WORK/pr"
          harn run --environment-policy granted \
            --grant "openai=env:OPENAI_API_KEY,expose=OPENAI_API_KEY,to=in_process" \
            --write-root "$SHIP_WORK/pr" \
            "$SHIP_WORK/agent/repair.harn"
      - name: Audit real repair records
        id: audit
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHIP_WORK: ${{ runner.temp }}/smartship-audit-control-${{ github.run_id }}
        run: |
          set -euo pipefail
          test -f "$SHIP_WORK/pr/.git/ship-result.json"
          python3 .credential-audit/scripts/ship_credential_fingerprints.py
          python3 .credential-audit/scripts/smart_ship_credential_audit.py \
            --fingerprints "$RUNNER_TEMP/smart-ship-audit-fingerprints.json" \
            --canary "$AUDIT_CANARY" --require-run-record \
            "$SHIP_WORK/agent/.harn-runs" "$SHIP_WORK/agent/.harn" \
            .smart-ship/scripts/smart-ship/.harn-runs \
            .smart-ship/scripts/smart-ship/.harn \
            "$SHIP_WORK/pr/.git/ship-task.json" "$SHIP_WORK/pr/.git/ship-result.json"
      - name: Publish the repair
        if: always() && steps.audit.outcome == 'success'
        working-directory: .smart-ship/scripts/smart-ship
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          SHIP_MODE: publish
          SHIP_WORK: ${{ runner.temp }}/smartship-audit-control-${{ github.run_id }}
        run: |
          set -euo pipefail
          # The look step wrote job.json outside the repair's write jail.
          [ -f "$SHIP_WORK/job.json" ] || exit 0
          harn run --no-sandbox ship.harn
      - name: Audit records after publication
        if: always() && steps.audit.outcome == 'success'
        env:
          SHIP_WORK: ${{ runner.temp }}/smartship-audit-control-${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 .credential-audit/scripts/smart_ship_credential_audit.py \
            --fingerprints "$RUNNER_TEMP/smart-ship-audit-fingerprints.json" \
            --canary "$AUDIT_CANARY" --require-run-record \
            "$SHIP_WORK/agent/.harn-runs" "$SHIP_WORK/agent/.harn" \
            .smart-ship/scripts/smart-ship/.harn-runs \
            .smart-ship/scripts/smart-ship/.harn \
            "$SHIP_WORK/pr/.git/ship-task.json" "$SHIP_WORK/pr/.git/ship-result.json"
      - name: Remove the checkouts
        if: always()
        env:
          SHIP_WORK: ${{ runner.temp }}/smartship-audit-control-${{ github.run_id }}
        run: rm -rf -- "$SHIP_WORK"
