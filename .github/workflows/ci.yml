name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read
jobs:
  controller-bootstrap:
    name: Check authenticated checkpoint adoption
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: burin-labs/harn/.github/actions/setup-harn@0f4c441cd7b062537a7eb607f120725eb6bf5019
        with:
          version: 0.10.167
      - name: Exercise the original deployed checkpoint through the installed public CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: HARN_BIN="$(command -v harn)" node --test scripts/controller/bootstrap.integration.test.mjs
      - name: Retain the measured adoption and control decisions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smart-ship-controller-qualification
          path: ${{ runner.temp }}/smart-ship-controller-qualification.json
          if-no-files-found: error
  release-bootstrap:
    name: Check the checkpoint release guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: burin-labs/harn/.github/actions/setup-harn@0f4c441cd7b062537a7eb607f120725eb6bf5019
        with:
          version: 0.10.167
      - name: Install the attested controller and release consumer
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-proof/bootstrap.sh
      - name: Prove the guard accepts original bytes and refuses invalid evidence
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/smart-ship-release/driver"
          harn check "$driver/release.harn" "$driver/test_release.harn"
          harn lint --strict "$driver/release.harn" "$driver/test_release.harn"
          HARN_BIN="$(command -v harn)" harn test "$driver/test_release.harn"
      - name: Build and inspect the complete verified site
        run: |
          set -euo pipefail
          python3 scripts/release-proof/test_build.py
          python3 verification/build_release.py
          python3 scripts/release-proof/inspect_site.py .smart-ship-pages.tar "$GITHUB_SHA"
  observer-bootstrap:
    name: Check the attested group observer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: burin-labs/harn/.github/actions/setup-harn@0f4c441cd7b062537a7eb607f120725eb6bf5019
        with:
          version: 0.10.167
      - name: Install the attested observer with protected configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/group-observer/bootstrap.mjs
      - name: Check the actual installed observer
        run: |
          set -euo pipefail
          observer="$RUNNER_TEMP/smart-ship-observer/package/github-observer-cli.harn"
          harn check "$observer"
          harn lint --strict "$observer"
      - name: Exercise the credential handoff through the real CLI
        run: HARN_BIN="$(command -v harn)" node --test scripts/admission-proof/secret-run.integration.test.mjs
  admission-bootstrap:
    name: Check the packed admission driver
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: burin-labs/harn/.github/actions/setup-harn@0f4c441cd7b062537a7eb607f120725eb6bf5019
        with:
          version: 0.10.167
      - name: Install the pinned packed product and its consumer
        run: bash scripts/admission-proof/bootstrap.sh
      - name: Check the actual installed driver
        run: |
          set -euo pipefail
          harn check "$RUNNER_TEMP/smart-ship-proof/driver/prepare.harn" "$RUNNER_TEMP/smart-ship-proof/driver/refusal-drill.harn"
          harn lint --strict "$RUNNER_TEMP/smart-ship-proof/driver/prepare.harn" "$RUNNER_TEMP/smart-ship-proof/driver/refusal-drill.harn"
      - name: Exercise packed stock commands with temporary fixture keys
        run: |
          set -euo pipefail
          HARN_BIN="$(command -v harn)" harn test "$RUNNER_TEMP/smart-ship-proof/package/tests/test_job_command.harn"
  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check
        id: check
        env:
          EVENT: ${{ github.event_name }}
          CHECK_SLEEP: 90
        run: ./check.sh
      - name: Verify admission credential handoff
        run: node --test scripts/admission-proof/secret-run.test.mjs
      - name: Bind the observed report to this execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s .ship-report.xml
          report_digest="$(sha256sum .ship-report.xml | cut -d ' ' -f 1)"
          inventory_digest="$(sha256sum verification/inventory.json | cut -d ' ' -f 1)"
          printf '{"schema":"smart-ship.github-stock-report.v1","repository":"%s","commit":"%s","run":%s,"attempt":%s,"job":"%s","inventory":"sha256:%s","report":{"path":".ship-report.xml","digest":"sha256:%s"}}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" "$inventory_digest" "$report_digest" > stock-report-receipt.json
      - name: Preserve the actual verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stock-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ship-report.xml
            stock-report-receipt.json
          include-hidden-files: true
          if-no-files-found: error
